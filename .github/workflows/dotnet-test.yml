name: .NET Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: dotnet test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      LumioRuntimeRoot: ${{ github.workspace }}/.runtime-source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout LumioGameRuntime
        uses: actions/checkout@v4
        with:
          repository: LumioGames/LumioGameRuntime
          ref: 7f198e533cd7d861f93f1ce5dd1e19942d122cf4
          path: .runtime-source
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore LumioClient.slnx
      - name: Test
        run: dotnet test LumioClient.slnx --no-restore --nologo

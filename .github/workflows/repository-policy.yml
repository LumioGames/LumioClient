name: Repository Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  readme:
    name: README policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository boundary documentation
        run: |
          test -s README.md
          test -s LICENSE
          test -s docs/architecture/LumioGameEngine_Architecture_v0.3.md
          grep -q '^## 职责$' README.md
          grep -q '^## 明确不负责什么$' README.md
          grep -q '^## Source / Compile-Time Dependencies$' README.md
          grep -q '^## Headless Test Surface$' README.md
          grep -q '^# LumioGameEngine V3 (v0.3)' docs/architecture/LumioGameEngine_Architecture_v0.3.md
